<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">HoneyGuide food processing pathway</title><desc id="desc">An illustrative isometric sequence of receiving, washing, slicing, frying and packaging stations. Conceptual only, not a depiction of installed equipment.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171713"/><stop offset="1" stop-color="#080807"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4d98d"/><stop offset=".5" stop-color="#d6a638"/><stop offset="1" stop-color="#94681b"/></linearGradient>
 <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#62615a"/><stop offset=".5" stop-color="#292a26"/><stop offset="1" stop-color="#151613"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="12"/></filter>
 <pattern id="grid" width="52" height="30" patternUnits="userSpaceOnUse"><path d="M52 0H0V30" fill="none" stroke="#d6a638" stroke-opacity=".12" stroke-width="1"/></pattern>
</defs>
<rect width="1200" height="700" rx="26" fill="url(#bg)"/><rect width="1200" height="700" rx="26" fill="url(#grid)"/>
<path d="M70 495 600 190 1130 495 600 650Z" fill="#080807" stroke="#d6a638" stroke-opacity=".32" stroke-width="2"/>
<path d="M110 495 600 215 1090 495 600 625Z" fill="#14140f" stroke="#f1c969" stroke-opacity=".18"/>
<!-- glowing route --> <path d="M150 466 360 345 565 466 770 345 1000 476" fill="none" stroke="#d6a638" stroke-opacity=".35" stroke-width="12" filter="url(#shadow)"/><path d="M150 466 360 345 565 466 770 345 1000 476" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" stroke-dasharray="15 15"><animate attributeName="stroke-dashoffset" values="0;-120" dur="6s" repeatCount="indefinite"/></path>
<!-- Station 1: receiving hopper -->
<g class="station station-one" transform="translate(105 285)"><ellipse cx="95" cy="185" rx="102" ry="20" fill="#000" opacity=".5"/><path d="M15 45 95 0 175 45 95 92Z" fill="#6d6a5e" stroke="#d6a638"/><path d="M15 45V135L95 182V92Z" fill="url(#steel)" stroke="#a98535"/><path d="M175 45V135L95 182V92Z" fill="#292a25" stroke="#a98535"/><path d="M15 45 95 92 175 45" fill="none" stroke="#f1c969" stroke-width="2"/><path d="M45 55 95 84 145 55" fill="none" stroke="#d6a638" stroke-opacity=".7"/><text x="95" y="215" fill="#f5f0e5" font-family="Arial,sans-serif" font-size="18" letter-spacing="2" text-anchor="middle">RECEIVE</text></g>
<!-- Station 2: wash drum -->
<g class="station station-two" transform="translate(310 190)"><ellipse cx="80" cy="250" rx="93" ry="18" fill="#000" opacity=".45"/><path d="M15 65 80 28 145 65 80 104Z" fill="#77776d" stroke="#d6a638"/><path d="M15 65V175L80 213V104Z" fill="#30312c" stroke="#a98535"/><path d="M145 65V175L80 213V104Z" fill="#1b1c18" stroke="#a98535"/><path d="M30 85 80 114 130 85V145L80 175 30 145Z" fill="#42433c" stroke="#d6a638"/><path d="M40 94 80 117 120 94M40 110 80 133 120 110M40 126 80 149 120 126" fill="none" stroke="#f1c969" stroke-opacity=".75" stroke-width="3"/><text x="80" y="245" fill="#f5f0e5" font-family="Arial,sans-serif" font-size="18" letter-spacing="2" text-anchor="middle">WASH</text></g>
<!-- Station 3: slicer -->
<g class="station station-three" transform="translate(500 300)"><ellipse cx="75" cy="180" rx="95" ry="18" fill="#000" opacity=".45"/><path d="M5 38 75 0 145 38 75 78Z" fill="#8c8879" stroke="#d6a638"/><path d="M5 38V125L75 165V78Z" fill="url(#steel)" stroke="#a98535"/><path d="M145 38V125L75 165V78Z" fill="#22231f" stroke="#a98535"/><circle cx="75" cy="67" r="32" fill="#171814" stroke="#f1c969" stroke-width="3"/><circle cx="75" cy="67" r="6" fill="#f1c969"/><path d="M75 37V97M45 67H105M54 46 96 88M96 46 54 88" stroke="#d6a638" stroke-width="3" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 75 67" to="360 75 67" dur="10s" repeatCount="indefinite"/></path><text x="75" y="198" fill="#f5f0e5" font-family="Arial,sans-serif" font-size="18" letter-spacing="2" text-anchor="middle">SLICE</text></g>
<!-- Station 4: fryer -->
<g class="station station-four" transform="translate(700 190)"><ellipse cx="80" cy="250" rx="100" ry="18" fill="#000" opacity=".45"/><path d="M10 65 80 25 150 65 80 105Z" fill="#77766c" stroke="#d6a638"/><path d="M10 65V175L80 215V105Z" fill="#252620" stroke="#a98535"/><path d="M150 65V175L80 215V105Z" fill="#171814" stroke="#a98535"/><path d="M30 76 80 105 130 76V132L80 161 30 132Z" fill="#34352d" stroke="#d6a638"/><path d="M43 101q12-16 24 0t24 0t24 0" fill="none" stroke="#f1c969" stroke-width="4" stroke-linecap="round"><animate attributeName="opacity" values=".45;1;.45" dur="2.8s" repeatCount="indefinite"/></path><text x="80" y="245" fill="#f5f0e5" font-family="Arial,sans-serif" font-size="18" letter-spacing="2" text-anchor="middle">FRY</text></g>
<!-- Station 5: packaging -->
<g class="station station-five" transform="translate(900 285)"><ellipse cx="80" cy="185" rx="100" ry="18" fill="#000" opacity=".45"/><path d="M10 45 80 5 150 45 80 85Z" fill="#8b8062" stroke="#d6a638"/><path d="M10 45V135L80 175V85Z" fill="#282923" stroke="#a98535"/><path d="M150 45V135L80 175V85Z" fill="#161713" stroke="#a98535"/><path d="M48 63 80 45 112 63 112 115 80 133 48 115Z" fill="#d6a638" stroke="#f1c969"/><path d="M48 63 80 81 112 63M80 81V133" fill="none" stroke="#fff0b9" stroke-width="2"/><text x="80" y="210" fill="#f5f0e5" font-family="Arial,sans-serif" font-size="18" letter-spacing="2" text-anchor="middle">PACK</text></g>
<text x="600" y="70" fill="#f1c969" font-family="Arial,sans-serif" font-size="16" letter-spacing="5" text-anchor="middle">ILLUSTRATIVE PROCESSING PATHWAY</text><text x="600" y="101" fill="#c9c4b8" font-family="Arial,sans-serif" font-size="13" letter-spacing="2" text-anchor="middle">RECEIVING · WASHING · SLICING · FRYING · PACKAGING</text>
</svg>